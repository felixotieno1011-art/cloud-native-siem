version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: siem
      POSTGRES_PASSWORD: siem
      POSTGRES_DB: siem
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      PGHOST: db
      PGUSER: siem
      PGPASSWORD: siem
      PGDATABASE: siem
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis

  dashboard:
    build: ./dashboard
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
